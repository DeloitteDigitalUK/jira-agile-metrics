# How to connect to JIRA?
Connection:
    Domain: https://jira.example.org

# Search criteria
Query: Project=EE AND IssueType=Story AND (Resolution IS NULL OR Resolution IN (Completed, Withdrawn))

# Describe the workflow. Each step can be mapped to either a single JIRA
# status, or a list of statuses that will be treated as equivalent
Workflow:
    Backlog:
       - Backlog
       - Soon
       - New
       - In Triage
    Next: Next
    Analysis in Progress: Analysis in Progress
    Analysis Done: Analysis Done
    Sign Off in Progress: Sign Off in Progress
    Sign Off Done: Sign Off Done
    Development in Progress:
       - Development in Progress
       - In Progress
    Development Done: Development Done
    Tech QA in Progress: Tech QA in Progress
    Tech QA Done: Tech QA Done
    Test QA in Progress:
        - Test QA in Progress
        - In Test
        - Test
        - Ready for AutoSIT
        - Ready for PRP1
        - Test in PRP1
        - In Auto SIT
        - Test In PRP2
    Test QA Done:
        - Test QA Done
        - Ready To Amaze
    Done:
        - Done
        - Amazing
        - Live

# Map field names to additional attributes to extract
Attributes:
    Priority: Priority
    Release: Fix version/s

# Copilot configuration - used for accessing a cloud LLM
Copilot:
  Provider: openai  # openai, anthropic, azure
  Model: gpt-4o
  API Key Environment Variable: OPENAI_API_KEY  # Environment variable name containing API key
  Max Tokens: 2000
  Temperature: 0.1

# Output options
Output:

    Quantiles:
        - 0.5
        - 0.85
        - 0.95

    ## Output data files to produce
    Cycle time data: cycletime.json
    Copilot Context: ai-context.json
    CFD data: cfd.csv
    
