# Example configuration for jira-agile-metrics with AI copilot functionality
# Copy this to your own config file and customize as needed

# JIRA connection settings
Connection:
  type: jira
  domain: https://your-company.atlassian.net
  username: your-email@company.com
  # password: leave blank to be prompted
  jira_client_options:
    server_info: false

# Query and workflow settings
Queries:
  - value: Team Alpha
    jql: project = PROJ AND fixVersion in unreleasedVersions() AND updated >= -14d

# Define your workflow stages
Cycle:
  - To Do
  - In Progress
  - Code Review
  - Testing
  - Done

# Workflow configuration
Workflow:
  committed_column: In Progress
  done_column: Done
  
# Copilot Configuration
Copilot:
  Provider: openai  # openai, anthropic, azure
  Model: gpt-4o
  API Key Environment Variable: OPENAI_API_KEY  # Environment variable name
  Max Tokens: 2000
  Temperature: 0.1
  Analysis Depth: basic  # disabled, basic, enhanced, experimental


# Output settings
Output:
  # Standard metrics outputs
  Cycle time data: cycletime.csv
  CFD chart: cfd.png
  Scatterplot chart: scatterplot.png
  Throughput chart: throughput.png
  Ageing WIP chart: ageing-wip.png
  
  # Copilot context output (automatically generated when Copilot block is present)
  Copilot Context: ai-context.json
