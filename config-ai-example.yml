# Example configuration for jira-agile-metrics with AI copilot functionality
# Copy this to your own config file and customize as needed

# JIRA connection settings
Connection:
  type: jira
  domain: https://your-company.atlassian.net
  username: your-email@company.com
  # password: leave blank to be prompted
  jira_client_options:
    server_info: false

# Query and workflow settings
Queries:
  - value: Team Alpha
    jql: project = PROJ AND fixVersion in unreleasedVersions() AND updated >= -14d

# Define your workflow stages
Cycle:
  - To Do
  - In Progress
  - Code Review
  - Testing
  - Done

# Workflow configuration
Workflow:
  committed_column: In Progress
  done_column: Done
  
# Team and sprint information
Settings:
  team_name: "Backend Team Alpha"
  current_sprint: "Sprint 23"
  sprint_start: "2025-08-21"
  sprint_end: "2025-09-04"
  
  # AI Copilot Configuration
  ai:
    enabled: true
    provider: openai  # openai, anthropic, azure
    model: gpt-4o
    api_key_env: OPENAI_API_KEY  # Environment variable name
    max_tokens: 2000
    temperature: 0.1
    
  # Context file for AI analysis
  ai_context_file: ai-context.json

# Output settings
Output:
  # Standard metrics outputs
  Cycle time data: cycletime.csv
  CFD chart: cfd.png
  Scatterplot chart: scatterplot.png
  Throughput chart: throughput.png
  Ageing WIP chart: ageing-wip.png
  
  # AI context output (automatically generated when ai.enabled = true)
  # This file will be consumed by the AI insights generator
